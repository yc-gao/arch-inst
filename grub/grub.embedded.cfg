insmod part_gpt
insmod part_msdos
insmod iso9660

insmod btrfs
insmod ext2
insmod exfat
insmod fat

insmod all_video

if search --set=root --no-floppy --label rootdisk; then
    set timeout=3
    menuentry 'Arch Linux' {
        echo    'Loading Linux linux-lts ...'
        linux   /rootfs/boot/vmlinuz-linux-lts root=LABEL=rootdisk rootflags=subvol=rootfs rw loglevel=3 quiet
        echo    'Loading initial ramdisk ...'
        initrd  /rootfs/boot/initramfs-linux-lts.img
    }

    menuentry "System shutdown" --class shutdown --class poweroff {
        echo "System shutting down..."
        halt
    }

    menuentry "System restart" --class reboot --class restart {
        echo "System rebooting..."
        reboot
    }
else
    echo "rootdisk not found, falling back to interactive grub shell"
    sleep 10
fi